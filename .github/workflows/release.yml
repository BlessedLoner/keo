# Builds, checks and publishes the Windows installer when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
# The installer appears on GitHub Releases, where the download page finds it;
# latest.yml and the .blockmap let installed copies update themselves. Nothing runs on other pushes.
name: Release

on:
  push:
    tags: ['v*']
  # Manual test run (Actions → Release → Run workflow): builds and tests, publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.6.0'
          cache: npm
      - run: npm ci
      # Electron 44 no longer downloads its runtime on install; the installer bundles it from here.
      - name: Download the Electron runtime
        run: node node_modules/electron/install.js
      - name: The tag must match package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # Each check reports its last error lines as annotations and in the job summary,
      # so a failure can be read without opening the full log.
      - name: Typecheck, lint, test and package
        shell: bash
        env:
          FORCE_COLOR: '0'
          NO_COLOR: '1'
          # Keo's own Google OAuth client (Desktop app) for one-click "Sign in with Google".
          # Repository secrets; when absent, the build simply has no built-in client.
          KEO_GOOGLE_CLIENT_ID: ${{ secrets.KEO_GOOGLE_CLIENT_ID }}
          KEO_GOOGLE_CLIENT_SECRET: ${{ secrets.KEO_GOOGLE_CLIENT_SECRET }}
        run: |
          check() {
            local name="$1"; shift
            if ! "$@" > "$name.log" 2>&1; then
              { echo "### $name failed"; echo '```'; tail -n 60 "$name.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              tail -n 25 "$name.log" | while IFS= read -r line; do [ -n "$line" ] && echo "::error title=$name::$line"; done
              exit 1
            fi
            echo "$name passed" >> "$GITHUB_STEP_SUMMARY"
          }
          # Whether this build carries Keo's built-in Google client (never the values).
          # The ID must be exactly a Google client ID (Keo ignores anything else); the values are never printed.
          gid="$(printf '%s' "$KEO_GOOGLE_CLIENT_ID" | tr -d '[:space:]')"
          if [ -n "$gid" ] && ! [[ "$gid" =~ ^[A-Za-z0-9-]+\.apps\.googleusercontent\.com$ ]]; then
            echo "::warning title=Google sign-in::KEO_GOOGLE_CLIENT_ID is set but is not a Google client ID (it must end in .apps.googleusercontent.com, nothing else). The build has no built-in Google client."
            echo "Built-in Google client: secret has the wrong format" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$gid" ] && [ -n "$KEO_GOOGLE_CLIENT_SECRET" ]; then
            echo "::notice title=Google sign-in::Built-in Google client included"
            echo "Built-in Google client: included" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Google sign-in::No built-in Google client (KEO_GOOGLE_CLIENT_ID / KEO_GOOGLE_CLIENT_SECRET secrets missing)"
            echo "Built-in Google client: missing" >> "$GITHUB_STEP_SUMMARY"
          fi
          check typecheck npm run typecheck
          check lint npm run lint
          check test npm test
          check package npm run package:win
          check update-files test -f release/latest.yml
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/Keo-Setup-*.exe release/Keo-Setup-*.exe.blockmap release/latest.yml \
            --title "Keo $GITHUB_REF_NAME" \
            --notes "Download **Keo-Setup-${GITHUB_REF_NAME#v}.exe** below and run it. This beta is not code-signed: Windows shows *Windows protected your PC* — choose *More info → Run anyway*. Your data and settings are kept when you install over an older version." \
            --generate-notes
